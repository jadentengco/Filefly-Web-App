# GitHub Pages workflow for building and deploying Vite React apps
name: Deploy Vite app to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job: installs packages and compiles Vite app to dist/
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Vite application
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path || '' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload compiled dist directory
          path: './dist'

  # Deployment job: deploys compiled artifact to GitHub Pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
